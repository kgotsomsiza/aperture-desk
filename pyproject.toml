[project]
name = "aperture-desk"
version = "0.1.0"
description = "An autonomous options desk that hires, fires and funds its own strategies, built on Alpaca."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aperture"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
